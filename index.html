<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7fb">
<title>考勤管家</title>
<style>
:root{--ink:#172033;--muted:#718096;--line:#e7ebf2;--paper:#fff;--bg:#f5f7fb;--blue:#4263eb;--blue2:#edf1ff;--green:#16865b;--greenbg:#e8f7f0;--orange:#bd6a12;--orangebg:#fff3e5;--red:#c23c48;--redbg:#fff0f0;--shadow:0 8px 28px #1c2a4410}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:238px;background:#fff;border-right:1px solid var(--line);padding:25px 16px;display:flex;flex-direction:column;z-index:3}.brand{display:flex;align-items:center;gap:11px;padding:0 10px 30px;font-weight:750;font-size:18px}.logo{width:36px;height:36px;border-radius:12px;background:var(--blue);color:white;display:grid;place-items:center;font-size:19px}.nav-label{font-size:11px;color:#9aa4b5;letter-spacing:1px;padding:8px 12px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#586477;text-align:left;border-radius:10px;padding:11px 12px;display:flex;align-items:center;gap:12px}.nav button.active,.nav button:hover{background:var(--blue2);color:var(--blue);font-weight:650}.nav .ico{width:20px;text-align:center;font-size:17px}.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding:16px 10px 0;color:var(--muted);font-size:12px}.main{margin-left:238px;max-width:1600px;padding:28px 38px 56px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:27px}.crumb{font-size:13px;color:var(--muted)}h1{font-size:25px;margin:5px 0 0;letter-spacing:-.4px}.top-actions{display:flex;align-items:center;gap:10px}.today{font-size:13px;color:var(--muted);padding-right:8px}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 14px;border-radius:9px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn:hover{border-color:#b9c5df}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.primary:hover{background:#3153df}.btn.small{font-size:13px;padding:7px 11px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:22px}.card,.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.card{padding:18px 19px}.card-head{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}.card-ico{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;background:#f1f4fb;font-size:16px}.metric{font-size:28px;font-weight:730;margin:9px 0 3px;letter-spacing:-.5px}.hint{font-size:12px;color:var(--muted)}.hint.good{color:var(--green)}.layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(290px,.9fr);gap:18px}.panel{padding:20px;margin-bottom:18px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px}.panel-title{font-weight:700;font-size:16px}.panel-sub{font-size:12px;color:var(--muted);margin-top:3px}.filters{display:flex;align-items:center;gap:9px}.select,input[type=date],input[type=month]{border:1px solid var(--line);background:#fff;padding:8px 10px;border-radius:8px;color:var(--ink)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:#8b95a6;font-size:12px;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}td{padding:13px 12px;border-bottom:1px solid #f0f2f6;font-size:13px}tbody tr:last-child td{border-bottom:0}.person{display:flex;align-items:center;gap:9px}.avatar{width:31px;height:31px;border-radius:50%;background:#eaf0ff;color:#4263eb;display:grid;place-items:center;font-size:12px;font-weight:700}.person-name{font-weight:600}.subtle{font-size:11px;color:var(--muted)}.pill{border-radius:20px;padding:4px 9px;font-weight:600;font-size:11px;display:inline-block}.pill.ok{background:var(--greenbg);color:var(--green)}.pill.late{background:var(--orangebg);color:var(--orange)}.pill.leave{background:var(--blue2);color:var(--blue)}.pill.absent{background:var(--redbg);color:var(--red)}.pill.pending{background:#f2f3f6;color:#667085}.activity{display:grid;gap:0}.activity-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #f0f2f6}.activity-item:last-child{border:0}.dot{width:9px;height:9px;border-radius:50%;background:var(--green);margin:6px 1px 0;flex:none}.dot.orange{background:#e79a39}.activity-text{font-size:13px}.activity-time{font-size:11px;color:var(--muted);margin-top:3px}.leave-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f0f2f6;font-size:13px}.leave-row:last-child{border:0}.empty{padding:28px;text-align:center;color:var(--muted)}.section{display:none}.section.active{display:block}.toolbar{display:flex;gap:10px;align-items:center}.month-label{font-weight:650}.mobile-nav{display:none}.modal-backdrop{position:fixed;inset:0;background:#10182866;z-index:10;display:none;align-items:center;justify-content:center;padding:16px}.modal-backdrop.open{display:flex}.modal{background:#fff;border-radius:16px;width:min(480px,100%);padding:22px;box-shadow:0 24px 80px #0003}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h2{font-size:19px;margin:0}.close{border:0;background:#f2f4f7;border-radius:8px;width:32px;height:32px;font-size:18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:600;color:#5c6678}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff}.field textarea{resize:vertical;min-height:70px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#172033;color:#fff;padding:11px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:20;display:none;font-size:13px}.toast.show{display:block}.mobile-menu{display:none}
@media(max-width:1080px){.main{padding:25px 24px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:1fr}.sidebar{width:210px}.main{margin-left:210px}}
@media(max-width:700px){.sidebar{display:none}.main{margin:0;padding:18px 15px 92px}.topbar{align-items:flex-start;margin-bottom:19px}.crumb{display:none}h1{font-size:22px}.today{display:none}.top-actions .btn:not(.primary){display:none}.cards{gap:10px;margin-bottom:14px}.card{padding:14px}.metric{font-size:24px}.card-head{font-size:12px}.card-ico{width:28px;height:28px}.layout{gap:0}.panel{padding:15px;margin-bottom:13px}.panel-head{align-items:flex-start;flex-wrap:wrap}.filters{width:100%}.filters select{flex:1;min-width:0}.toolbar{width:100%;justify-content:space-between}.table-wrap{margin:0 -15px;padding:0 15px}th,td{padding:11px 10px}.mobile-nav{position:fixed;display:flex;bottom:0;inset-inline:0;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid var(--line);justify-content:space-around;padding:8px 4px max(8px,env(safe-area-inset-bottom));z-index:4}.mobile-nav button{border:0;background:transparent;color:#7b8595;display:grid;gap:2px;justify-items:center;font-size:10px;min-width:55px}.mobile-nav button .ico{font-size:18px}.mobile-nav button.active{color:var(--blue);font-weight:650}.panel-head .btn{padding:7px 9px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
.auth-gate{position:fixed;inset:0;background:#f5f7fb;z-index:30;display:flex;align-items:center;justify-content:center;padding:18px}.auth-box{background:white;border:1px solid var(--line);border-radius:18px;padding:28px;width:min(420px,100%);box-shadow:var(--shadow)}.auth-box h2{margin:0 0 6px;font-size:22px}.auth-box p{color:var(--muted);font-size:13px;margin:0 0 20px}.auth-box .field{margin:12px 0}.auth-box .btn{width:100%;margin-top:10px}.auth-note{font-size:12px;color:var(--muted);margin-top:14px}.cloud-status{position:fixed;right:14px;bottom:12px;z-index:5;background:#fff;border:1px solid var(--line);border-radius:20px;padding:6px 10px;font-size:11px;color:var(--muted);box-shadow:var(--shadow)}.cloud-status.online{color:var(--green)}.cloud-status.error{color:var(--red)}
</style>
</head>
<body><div class="app"><aside class="sidebar"><div class="brand"><div class="logo">✓</div>考勤管家</div><div class="nav-label">工作台</div><nav class="nav" id="sideNav"><button class="active" data-page="overview"><span class="ico">▦</span>考勤概览</button><button data-page="records"><span class="ico">◷</span>考勤记录</button><button data-page="leave"><span class="ico">▤</span>请假管理 <span id="leaveBadge"></span></button><button data-page="staff"><span class="ico">♙</span>员工管理</button></nav><div class="side-bottom">本地数据自动保存<br>考勤管家 · 简易版</div></aside><main class="main"><header class="topbar"><div><div class="crumb">工作台 / <span id="crumb">考勤概览</span></div><h1 id="pageTitle">早上好，今天考勤情况怎么样？</h1></div><div class="top-actions"><span class="today" id="todayText"></span><button class="btn" onclick="openModal('leave')">＋ 申请请假</button><button class="btn primary" onclick="openModal('clock')">◷ 员工打卡</button></div></header>
<section class="section active" id="overview"><div class="cards" id="summaryCards"></div><div class="layout"><div><div class="panel"><div class="panel-head"><div><div class="panel-title">今日考勤</div><div class="panel-sub" id="todaySub"></div></div><div class="filters"><select class="select" id="deptFilter" onchange="renderOverview()"><option value="全部部门">全部部门</option></select></div></div><div class="table-wrap"><table><thead><tr><th>员工</th><th>上班</th><th>下班</th><th>状态</th></tr></thead><tbody id="todayTable"></tbody></table></div></div><div class="panel"><div class="panel-head"><div><div class="panel-title">本月考勤汇总</div><div class="panel-sub">按员工统计出勤与请假</div></div><button class="btn small" onclick="go('records')">查看记录 →</button></div><div class="table-wrap"><table><thead><tr><th>员工</th><th>出勤</th><th>迟到</th><th>请假</th></tr></thead><tbody id="monthlyTable"></tbody></table></div></div></div><div><div class="panel"><div class="panel-head"><div><div class="panel-title">最近动态</div><div class="panel-sub">今天的打卡和审批动态</div></div></div><div class="activity" id="activity"></div></div><div class="panel"><div class="panel-head"><div><div class="panel-title">待处理请假</div><div class="panel-sub">等待审批的申请</div></div><button class="btn small" onclick="go('leave')">全部 →</button></div><div id="pendingList"></div></div></div></div></section>
<section class="section" id="records"><div class="panel"><div class="panel-head"><div><div class="panel-title">考勤记录</div><div class="panel-sub">查看每日上下班及考勤状态</div></div><div class="filters"><input id="recordDate" type="date" onchange="renderRecords()"><select class="select" id="recordPerson" onchange="renderRecords()"><option value="">所有员工</option></select><button class="btn small" onclick="exportCsv()">⇩ 导出 CSV</button></div></div><div class="table-wrap"><table><thead><tr><th>日期</th><th>员工</th><th>上班</th><th>下班</th><th>状态</th></tr></thead><tbody id="recordTable"></tbody></table></div></div></section>
<section class="section" id="leave"><div class="panel"><div class="panel-head"><div><div class="panel-title">请假申请</div><div class="panel-sub">查看申请并记录审批状态</div></div><button class="btn primary small" onclick="openModal('leave')">＋ 新建申请</button></div><div class="table-wrap"><table><thead><tr><th>员工</th><th>类型</th><th>请假日期</th><th>原因</th><th>状态</th><th>操作</th></tr></thead><tbody id="leaveTable"></tbody></table></div></div></section>
<section class="section" id="staff"><div class="panel"><div class="panel-head"><div><div class="panel-title">员工管理</div><div class="panel-sub">维护员工基础信息和部门</div></div><button class="btn primary small" onclick="openModal('staff')">＋ 添加员工</button></div><div class="table-wrap"><table><thead><tr><th>员工</th><th>部门</th><th>工号</th><th>今日状态</th><th>操作</th></tr></thead><tbody id="staffTable"></tbody></table></div></div></section></main><nav class="mobile-nav" id="mobileNav"><button class="active" data-page="overview"><span class="ico">▦</span>概览</button><button data-page="records"><span class="ico">◷</span>记录</button><button data-page="leave"><span class="ico">▤</span>请假</button><button data-page="staff"><span class="ico">♙</span>员工</button></nav></div>
<div class="auth-gate" id="authGate"><div class="auth-box"><div class="logo" style="margin-bottom:16px">✓</div><h2>登录考勤管家</h2><p>登录团队账号，在手机和电脑之间同步考勤数据。</p><form id="authForm"><div class="field"><label>邮箱</label><input type="email" name="email" required autocomplete="username" placeholder="name@example.com"></div><div class="field"><label>密码</label><input type="password" name="password" required minlength="6" autocomplete="current-password" placeholder="至少 6 位"></div><button class="btn primary" id="authSubmit">登录</button><button class="btn" type="button" id="signupBtn">创建账号</button></form><div class="auth-note" id="authNote">请使用团队管理员已加入名单的邮箱注册或登录。</div></div></div><div class="cloud-status" id="cloudStatus">云端未连接</div><div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2 id="modalTitle"></h2><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><script>
const today=new Date();const iso=d=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};const todayKey=iso(today),monthKey=todayKey.slice(0,7),fmtDate=s=>s?new Date(s+'T00:00:00').toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'}):'—';
const seed={staff:[{id:'E001',name:'张明',dept:'产品部'},{id:'E002',name:'李娜',dept:'设计部'},{id:'E003',name:'王磊',dept:'技术部'},{id:'E004',name:'陈佳',dept:'市场部'},{id:'E005',name:'刘洋',dept:'技术部'}],records:{},leaves:[]};let db;try{db=JSON.parse(localStorage.getItem('attendance-app-v1'))||seed}catch{db=seed}db.staff||=seed.staff;db.records||={};db.leaves||=[];window.__attendance={get db(){return db},set db(v){db=v}};function save(){localStorage.setItem('attendance-app-v1',JSON.stringify(db))}function record(date,id){db.records[date]||={};return db.records[date][id]||{in:'',out:'',status:'未打卡'}}function statusClass(s){return s==='正常'?'ok':s==='迟到'?'late':s==='请假'?'leave':s==='缺勤'?'absent':'pending'}function pill(s){return `<span class="pill ${statusClass(s)}">${s}</span>`}function esc(x=''){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function avatar(n){return `<span class="avatar">${esc(n.slice(-1))}</span>`}function person(s){return `<div class="person">${avatar(s.name)}<div><div class="person-name">${esc(s.name)}</div><div class="subtle">${esc(s.dept)}</div></div></div>`}
function render(){document.getElementById('todayText').textContent=today.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});const depts=[...new Set(db.staff.map(s=>s.dept))];const df=document.getElementById('deptFilter');const old=df.value;df.innerHTML='<option value="全部部门">全部部门</option>'+depts.map(d=>`<option>${esc(d)}</option>`).join('');df.value=depts.includes(old)?old:'全部部门';const rp=document.getElementById('recordPerson'),rpold=rp.value;rp.innerHTML='<option value="">所有员工</option>'+db.staff.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');rp.value=rpold;renderOverview();renderRecords();renderLeave();renderStaff();document.getElementById('leaveBadge').innerHTML=db.leaves.some(l=>l.status==='待审批')?'<span class="pill late" style="margin-left:auto;padding:2px 7px">新</span>':''}
function renderOverview(){const stats=db.staff.map(s=>({s,r:record(todayKey,s.id)}));const present=stats.filter(x=>x.r.in).length,late=stats.filter(x=>x.r.status==='迟到').length,leave=db.leaves.filter(l=>l.status==='已批准'&&todayKey>=l.from&&todayKey<=l.to).length,rate=db.staff.length?Math.round((present+leave)/db.staff.length*100):0;document.getElementById('summaryCards').innerHTML=[['在职员工',db.staff.length,'人','♙','团队成员'],['今日已打卡',present,'人','◷',`出勤率 ${rate}%`],['今日迟到',late,'人','⌁',late?'需要关注':'状态良好'],['今日请假',leave,'人','▤','已批准申请']].map((a,i)=>`<div class="card"><div class="card-head">${a[0]}<span class="card-ico">${a[3]}</span></div><div class="metric">${a[1]}<span style="font-size:13px;font-weight:500;margin-left:4px">${a[2]}</span></div><div class="hint ${i===2&&!late?'good':''}">${a[4]}</div></div>`).join('');document.getElementById('todaySub').textContent=`${today.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'})} · 共 ${db.staff.length} 人`;const dep=dfVal();document.getElementById('todayTable').innerHTML=stats.filter(x=>dep==='全部部门'||x.s.dept===dep).map(({s,r})=>`<tr><td>${person(s)}</td><td>${r.in||'—'}</td><td>${r.out||'—'}</td><td>${pill(r.status)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">暂无员工，添加员工后开始记录</td></tr>';document.getElementById('monthlyTable').innerHTML=stats.map(({s})=>{const rs=Object.entries(db.records).filter(([d,day])=>d.startsWith(monthKey)&&day[s.id]);const days=rs.filter(([,r])=>r.in).length,ls=db.leaves.filter(l=>l.staff===s.id&&l.status==='已批准'&&l.from.startsWith(monthKey)).length,lt=rs.filter(([,r])=>r.status==='迟到').length;return `<tr><td>${person(s)}</td><td>${days} 天</td><td>${lt} 次</td><td>${ls} 天</td></tr>`}).join('')||'<tr><td colspan="4" class="empty">暂无数据</td></tr>';const events=stats.filter(x=>x.r.in).map(({s,r})=>({name:s.name,text:`${s.name} ${r.status==='迟到'?'迟到打卡':'已打卡上班'}`,time:r.in,late:r.status==='迟到'})).sort((a,b)=>b.time.localeCompare(a.time)).slice(0,5);document.getElementById('activity').innerHTML=events.length?events.map(e=>`<div class="activity-item"><span class="dot ${e.late?'orange':''}"></span><div><div class="activity-text">${esc(e.text)}</div><div class="activity-time">今天 ${e.time}</div></div></div>`).join(''):'<div class="empty">今天还没有打卡记录</div>';const pend=db.leaves.filter(l=>l.status==='待审批').slice(0,3);document.getElementById('pendingList').innerHTML=pend.length?pend.map(l=>`<div class="leave-row"><span>${esc(staffName(l.staff))} · ${esc(l.type)}</span><span class="subtle">${fmtDate(l.from)}</span></div>`).join(''):'<div class="empty">暂无待审批申请</div>'}
function dfVal(){return document.getElementById('deptFilter').value}function staffName(id){return db.staff.find(s=>s.id===id)?.name||'已删除员工'}function renderRecords(){const date=document.getElementById('recordDate').value||todayKey,who=document.getElementById('recordPerson').value;const arr=db.staff.filter(s=>!who||s.id===who).map(s=>({s,r:record(date,s.id)}));document.getElementById('recordTable').innerHTML=arr.map(({s,r})=>`<tr><td>${date}</td><td>${person(s)}</td><td>${r.in||'—'}</td><td>${r.out||'—'}</td><td>${pill(r.status)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">暂无记录</td></tr>'}
function renderLeave(){document.getElementById('leaveTable').innerHTML=db.leaves.length?[...db.leaves].reverse().map((l,i)=>`<tr><td>${person(db.staff.find(s=>s.id===l.staff)||{name:'已删除',dept:''})}</td><td>${esc(l.type)}</td><td>${fmtDate(l.from)}${l.to!==l.from?' 至 '+fmtDate(l.to):''}</td><td>${esc(l.reason||'—')}</td><td>${pill(l.status)}</td><td>${l.status==='待审批'?`<button class="btn small" onclick="approve(${db.leaves.length-1-i},true)">批准</button> <button class="btn small" onclick="approve(${db.leaves.length-1-i},false)">拒绝</button>`:'—'}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">还没有请假申请</td></tr>'}
function renderStaff(){document.getElementById('staffTable').innerHTML=db.staff.map(s=>`<tr><td>${person(s)}</td><td>${esc(s.dept)}</td><td>${esc(s.id)}</td><td>${pill(record(todayKey,s.id).status)}</td><td><button class="btn small" onclick="removeStaff('${esc(s.id)}')">移除</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">暂无员工</td></tr>'}
function go(page){document.querySelectorAll('.section').forEach(x=>x.classList.toggle('active',x.id===page));document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page));const names={overview:'考勤概览',records:'考勤记录',leave:'请假管理',staff:'员工管理'},titles={overview:'早上好，今天考勤情况怎么样？',records:'考勤记录',leave:'请假管理',staff:'员工管理'};document.getElementById('crumb').textContent=names[page];document.getElementById('pageTitle').textContent=titles[page];window.scrollTo(0,0)}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));
function clockIn(){if(!db.staff.length){toast('请先添加员工');go('staff');return}const s=db.staff[0],r=record(todayKey,s.id);if(r.in){toast(`${s.name}今天已打卡 ${r.in}`);return}const now=new Date(),time=now.toTimeString().slice(0,5);db.records[todayKey]||={};db.records[todayKey][s.id]={...r,in:time,status:time>'09:00'?'迟到':'正常'};save();render();toast(`${s.name} 上班打卡成功 · ${time}`)}
function clockOut(id){const r=record(todayKey,id);if(!r.in){toast('请先完成上班打卡');return}if(r.out){toast('今天已经完成下班打卡');return}db.records[todayKey][id]={...r,out:new Date().toTimeString().slice(0,5)};save();render();toast(`${staffName(id)} 下班打卡成功`)}
function openModal(type){const backdrop=document.getElementById('modalBackdrop'),body=document.getElementById('modalBody');if(type==='clock'){document.getElementById('modalTitle').textContent='员工上下班打卡';body.innerHTML=`<div class="form-grid"><div class="field full"><label>选择员工</label><select id="clockStaff">${db.staff.map(s=>`<option value="${esc(s.id)}">${esc(s.name)} · ${esc(s.dept)}</option>`).join('')}</select></div></div><div class="modal-actions" style="justify-content:space-between"><button class="btn" onclick="closeModal()">取消</button><span><button class="btn" onclick="doClock('in')">上班打卡</button> <button class="btn primary" onclick="doClock('out')">下班打卡</button></span></div>`}else if(type==='leave'){document.getElementById('modalTitle').textContent='新建请假申请';body.innerHTML=`<form id="leaveForm"><div class="form-grid"><div class="field full"><label>员工</label><select name="staff" required>${db.staff.map(s=>`<option value="${esc(s.id)}">${esc(s.name)} · ${esc(s.dept)}</option>`).join('')}</select></div><div class="field"><label>请假类型</label><select name="type"><option>年假</option><option>事假</option><option>病假</option><option>调休</option><option>其他</option></select></div><div class="field"><label>开始日期</label><input type="date" name="from" value="${todayKey}" required></div><div class="field"><label>结束日期</label><input type="date" name="to" value="${todayKey}" required></div><div class="field full"><label>请假原因</label><textarea name="reason" placeholder="填写请假原因（选填）"></textarea></div></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">取消</button><button class="btn primary">提交申请</button></div></form>`;document.getElementById('leaveForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);db.leaves.push({staff:f.get('staff'),type:f.get('type'),from:f.get('from'),to:f.get('to'),reason:f.get('reason'),status:'待审批'});save();closeModal();render();toast('请假申请已提交')}}else{document.getElementById('modalTitle').textContent='添加员工';body.innerHTML=`<form id="staffForm"><div class="form-grid"><div class="field"><label>姓名</label><input name="name" required placeholder="例如：赵敏"></div><div class="field"><label>工号</label><input name="id" placeholder="留空自动生成"></div><div class="field full"><label>部门</label><input name="dept" required placeholder="例如：运营部"></div></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">取消</button><button class="btn primary">添加员工</button></div></form>`;document.getElementById('staffForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),id=f.get('id')||`E${String(Date.now()).slice(-4)}`;if(db.staff.some(s=>s.id===id)){toast('该工号已存在');return}db.staff.push({id,name:f.get('name'),dept:f.get('dept')});save();closeModal();render();toast('员工添加成功')}}backdrop.classList.add('open')}
function doClock(kind){const id=document.getElementById('clockStaff')?.value;if(!id)return toast('请先添加员工');const r=record(todayKey,id),time=new Date().toTimeString().slice(0,5);if(kind==='in'){if(r.in)return toast(`${staffName(id)} 今天已于 ${r.in} 打卡`);db.records[todayKey]||={};db.records[todayKey][id]={...r,in:time,status:time>'09:00'?'迟到':'正常'};save();closeModal();render();toast(`${staffName(id)} 上班打卡成功 · ${time}`)}else{if(!r.in)return toast('请先完成上班打卡');if(r.out)return toast('今天已经完成下班打卡');db.records[todayKey][id]={...r,out:time};save();closeModal();render();toast(`${staffName(id)} 下班打卡成功 · ${time}`)}}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('open')}function approve(i,yes){db.leaves[i].status=yes?'已批准':'已拒绝';if(yes){const l=db.leaves[i];for(let d=new Date(l.from+'T00:00:00');iso(d)<=l.to;d.setDate(d.getDate()+1)){const k=iso(d);db.records[k]||={};db.records[k][l.staff]={...record(k,l.staff),status:'请假'}}}save();render();toast(yes?'已批准请假申请':'已拒绝请假申请')}function removeStaff(id){if(!confirm(`确定移除 ${staffName(id)}？`))return;db.staff=db.staff.filter(s=>s.id!==id);save();render();toast('员工已移除')}
function exportCsv(){const date=document.getElementById('recordDate').value||todayKey;const rows=[['日期','工号','姓名','部门','上班时间','下班时间','状态'],...db.staff.map(s=>{const r=record(date,s.id);return[date,s.id,s.name,s.dept,r.in,r.out,r.status]})];const csv='\ufeff'+rows.map(row=>row.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`考勤记录-${date}.csv`;a.click();URL.revokeObjectURL(a.href)}let toastTimer;function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2400)}render();
</script><script src="./cloud.js"></script></body></html>
